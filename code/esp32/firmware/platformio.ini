; ESP32 glucose-estimation firmware. Default target: ESP32-S3-DevKitC-1.
; Build + flash + monitor (PlatformIO):  pio run -e esp32-s3-devkitc-1 -t upload -t monitor
; Connect the board's "USB" port (native USB, works without drivers).
[platformio]
default_envs = esp32-s3-devkitc-1

[env]
platform = espressif32
framework = arduino
monitor_speed = 921600
upload_speed = 921600
build_unflags = -Os
build_flags = -O2

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
; serial output over the native "USB" port (no driver needed on Windows)
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1
; 3 MB app partition: room for the averaged-feature self-test windows (up to 3 x 16 min of PPG)
board_build.partitions = huge_app.csv

[env:esp32dev]
board = esp32dev

[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1

; ---------------- STM32 boards (same C model code; Arduino core STM32duino) ----------------
; Upload goes through the on-board ST-LINK. "mbed" upload copies the .bin to the ST-LINK USB drive,
; so no ST-LINK driver is needed on Windows. Serial: the ST-LINK virtual COM port.
[stm32_common]
platform = ststm32
framework = arduino
upload_protocol = mbed
monitor_speed = 460800
build_unflags = -Os
build_flags = -O2 -DSERIAL_BAUD=460800 -DSERIAL_RX_BUFFER_SIZE=4096 -DSERIAL_TX_BUFFER_SIZE=2048
    -Wl,-u,_printf_float

; STM32F746G-DISCO: Cortex-M7, 216 MHz, 1 MB flash, 320 kB SRAM (same core family as the STM32H7 of the original study)
[env:disco_f746ng]
extends = stm32_common
board = disco_f746ng

; NUCLEO-WB55RG (P-NUCLEO-WB55 kit, MB1355): Cortex-M4, 64 MHz, 1 MB flash, 192 kB SRAM for the application.
; Smaller beat buffer (150 beats), 16-bit peak indices and no per-beat CNN (RAM), and only the
; calibration-free tree model (the Arduino core may give the application only 512 kB of flash).
[env:nucleo_wb55rg_p]
extends = stm32_common
board = nucleo_wb55rg_p
build_flags = ${stm32_common.build_flags} -DGLU_MAX_BEATS=150 -DGLU_NO_CNN -DGLU_SMALL_RAM -DDEV_FREE_ONLY
